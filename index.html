<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Focus Personality Index</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .quiz-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      max-width: 520px;
      width: 90%;
      text-align: center;
    }

    .quiz-card h2 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .quiz-card .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 24px;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #222;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #f8f9fa;
      border: 1px solid #dcdfe6;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #333;
    }

    .option-btn:hover {
      background: #0066cc;
      color: #fff;
      border-color: #0066cc;
    }

    /* Jumpscare Elements */
    #scare-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    #scare-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: shake 0.08s infinite alternate;
    }

    @keyframes shake {
      0% { transform: scale(1.1) translate(4px, 4px) rotate(0.5deg); }
      50% { transform: scale(1.15) translate(-4px, -4px) rotate(-0.5deg); }
      100% { transform: scale(1.2) translate(3px, -3px) rotate(1deg); }
    }
  </style>
</head>
<body>

  <div class="quiz-card" id="quiz-box">
    <h2>Perception & Intuition Test</h2>
    <p class="subtitle" id="progress">Question 1 of 3</p>
    <p class="question-text" id="question">What color stands out most to you right now?</p>
    <div class="options" id="options-container">
      <button class="option-btn" onclick="nextQuestion()">Deep Crimson</button>
      <button class="option-btn" onclick="nextQuestion()">Midnight Blue</button>
      <button class="option-btn" onclick="nextQuestion()">Emerald Green</button>
    </div>
  </div>

  <div id="scare-screen">
    <!-- Replace the src URL with your preferred horrifying ghost image -->
    <img id="scare-image" src="https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=1200&q=80" alt="Ghost">
  </div>

  <!-- Screamer Audio -->
  <audio id="scream-sound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2180/2180-preview.mp3" type="audio/mpeg">
  </audio>

  <script>
    const questions = [
      {
        q: "What color stands out most to you right now?",
        options: ["Deep Crimson", "Midnight Blue", "Emerald Green"]
      },
      {
        q: "Listen closely to your surroundings. How many distinct noises do you hear?",
        options: ["1 to 2 sounds", "3 to 5 sounds", "Complete silence"]
      },
      {
        q: "Focus entirely on the center of the screen. Can you sense movement behind you?",
        options: ["Yes, distinctly", "No, not at all", "I'm not sure"]
      }
    ];

    let currentStep = 0;

    function nextQuestion() {
      currentStep++;

      if (currentStep < questions.length) {
        document.getElementById('progress').innerText = `Question ${currentStep + 1} of ${questions.length}`;
        document.getElementById('question').innerText = questions[currentStep].q;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        questions[currentStep].options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = nextQuestion;
          container.appendChild(btn);
        });
      } else {
        triggerJumpscare();
      }
    }

    function triggerJumpscare() {
      const scareScreen = document.getElementById('scare-screen');
      const sound = document.getElementById('scream-sound');

      scareScreen.style.display = 'flex';
      sound.currentTime = 0;
      sound.play().catch(e => console.log('Audio autoplay blocked:', e));

      // Request fullscreen to maximize the scare effect
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }
  </script>
</body>
</html>
