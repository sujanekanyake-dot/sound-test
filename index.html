<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acoustic Range & Tonal Sensitivity Diagnostic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background: #08080a;
      color: #7d8590;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .diagnostic-panel {
      background: #0d1117;
      border: 1px solid #21262d;
      padding: 32px;
      max-width: 480px;
      width: 90%;
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      position: relative;
    }

    .sys-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #388bfd;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #21262d;
      padding-bottom: 8px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #238636;
      border-radius: 50%;
      box-shadow: 0 0 6px #238636;
    }

    h1 {
      font-size: 1.1rem;
      color: #e6edf3;
      font-weight: 600;
      margin-bottom: 14px;
    }

    p {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #8b949e;
      margin-bottom: 24px;
    }

    .audio-meter {
      background: #010409;
      border: 1px solid #30363d;
      height: 60px;
      border-radius: 4px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .waveform-line {
      width: 100%;
      height: 2px;
      background: #1f6feb;
      opacity: 0.4;
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scaleY(1); opacity: 0.3; }
      50% { transform: scaleY(6); opacity: 0.7; }
    }

    .meter-text {
      position: absolute;
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: #484f58;
    }

    .btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 12px;
      font-size: 0.85rem;
      width: 100%;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #30363d;
      color: #58a6ff;
      border-color: #58a6ff;
    }

    /* ---------------- HORROR ENGINE OVERLAY ---------------- */
    #abyss-layer {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 9999999;
      cursor: none;
      overflow: hidden;
    }

    /* Distorted analog feed canvas */
    #horror-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      filter: contrast(300%) brightness(140%) grayscale(40%);
    }

    /* Subliminal Static Strobe */
    .flicker-mesh {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 20%, #000 90%);
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .red-flash {
      position: absolute;
      inset: 0;
      background: #ff0000;
      mix-blend-mode: color-burn;
      pointer-events: none;
      animation: hyperFlicker 0.03s infinite alternate;
    }

    @keyframes hyperFlicker {
      0% { opacity: 0; }
      50% { opacity: 0.85; }
      100% { opacity: 0.1; }
    }
  </style>
</head>
<body>

  <div class="diagnostic-panel" id="panel">
    <div class="sys-header">
      <span>System Tone Calibrator v4.2</span>
      <span><span class="status-dot"></span> Online</span>
    </div>

    <h1 id="diag-title">Ultra-Low Frequency Isolation</h1>
    <p id="diag-desc">
      This test plays a very faint 18Hz infrasound wave. Set your volume to <strong>75%–100%</strong>, bring your ear close to the device speaker, and press confirm once the tone becomes audible.
    </p>

    <div class="audio-meter">
      <div class="waveform-line"></div>
      <div class="meter-text" id="meter-status">LISTENING: 0.00 dB</div>
    </div>

    <button class="btn" id="action-btn" onclick="nextStage()">Start Calibration Wave</button>
  </div>

  <div id="abyss-layer">
    <canvas id="horror-canvas"></canvas>
    <div class="flicker-mesh"></div>
    <div class="red-flash"></div>
  </div>

  <script>
    let stage = 0;
    let audioCtx;

    function nextStage() {
      // Initialize Audio Context on first interaction
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      stage++;

      if (stage === 1) {
        document.getElementById('diag-title').innerText = "Testing Micro-Frequency Shift";
        document.getElementById('diag-desc').innerHTML = "Tone output is extremely faint. <strong>Turn your device volume to maximum</strong> and place your ear directly against the speaker to detect the micro-tone.";
        document.getElementById('meter-status').innerText = "AUDIO EMISSION ACTIVE — 18.2 Hz";
        document.getElementById('action-btn').innerText = "I cannot hear it yet";

        // Play an almost inaudible soft hum to force them to crank the volume
        playBaitHum();
      } else if (stage === 2) {
        document.getElementById('diag-title').innerText = "Signal Attenuation Drop";
        document.getElementById('diag-desc').innerHTML = "Tone boosted by +4dB. Press the button below as soon as you detect the distinct whisper in the background.";
        document.getElementById('action-btn').innerText = "Listening closely...";
        
        // Short suspense delay before triggering the panic
        setTimeout(() => {
          triggerHorrorProtocol();
        }, 2200);
      }
    }

    function playBaitHum() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(55, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.015, audioCtx.currentTime); // Very quiet
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        setTimeout(() => osc.stop(), 2000);
      } catch (e) {}
    }

    function triggerHorrorProtocol() {
      const abyss = document.getElementById('abyss-layer');
      abyss.style.display = 'block';

      // Lock Fullscreen
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      // Start procedural Uncanny Canvas Face
      startCanvasAbomination();

      // Synthesize intense layered biomechanical scream / dissonance
      playDevastatingAudio();
    }

    // Audio Engine: Procedural multi-layer distorted screech
    function playDevastatingAudio() {
      try {
        const t0 = audioCtx.currentTime;

        // 1. Violent High-Frequency Infrasonic Cluster
        const freqs = [380, 760, 1140, 1920, 3100, 4400, 5200, 6800];
        freqs.forEach(f => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, t0);
          
          // Violent irregular pitch warps
          osc.frequency.linearRampToValueAtTime(f * 2.2, t0 + 0.1);
          osc.frequency.exponentialRampToValueAtTime(f * 0.3, t0 + 0.8);
          osc.frequency.linearRampToValueAtTime(f * 1.5, t0 + 1.8);

          gain.gain.setValueAtTime(1.0, t0);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.2);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + 3.2);
        });

        // 2. Distorted White Noise Wall
        const bufferSize = audioCtx.sampleRate * 3.2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 1.2));
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(1.0, t0);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, t0 + 3.0);

        whiteNoise.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        whiteNoise.start(t0);

      } catch (err) {
        console.error(err);
      }
    }

    // Procedural Eldritch Flesh Generator on Canvas
    function startCanvasAbomination() {
      const canvas = document.getElementById('horror-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let frame = 0;

      function renderFrame() {
        frame++;
        const w = canvas.width;
        const h = canvas.height;

        // Base black void with violent jitter
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, w, h);

        const cx = w / 2 + (Math.random() - 0.5) * 40;
        const cy = h / 2 + (Math.random() - 0.5) * 40;

        // Pale, elongated skull-like structure
        ctx.save();
        ctx.translate(cx, cy);
        
        // Violent scale pulsing
        const scale = 1.3 + Math.sin(frame * 0.4) * 0.25 + (Math.random() * 0.1);
        ctx.scale(scale, scale * 1.4);

        // Sunken hollow face base
        ctx.fillStyle = '#d1cfc7';
        ctx.beginPath();
        ctx.ellipse(0, -20, 110, 180, 0, 0, Math.PI * 2);
        ctx.fill();

        // Giant Hollow Pitch-Black Eyes
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(-45 + (Math.random()*4), -40, 32, 48 + (Math.sin(frame) * 10), 0.1, 0, Math.PI * 2);
        ctx.ellipse(45 + (Math.random()*4), -40, 32, 48 + (Math.cos(frame) * 10), -0.1, 0, Math.PI * 2);
        ctx.fill();

        // Pin-prick piercing red pupils
        ctx.fillStyle = '#ff1100';
        ctx.beginPath();
        ctx.arc(-45 + (Math.random()*2), -40, 3, 0, Math.PI * 2);
        ctx.arc(45 + (Math.random()*2), -40, 3, 0, Math.PI * 2);
        ctx.fill();

        // Agonized Jaw Tear / Endless Open Mouth
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        const jawDrop = 80 + Math.abs(Math.sin(frame * 0.8) * 60);
        ctx.ellipse(0, 70, 42, jawDrop, 0, 0, Math.PI * 2);
        ctx.fill();

        // Jagged, chaotic needle teeth
        ctx.fillStyle = '#ffffff';
        for (let i = -35; i <= 35; i += 7) {
          ctx.fillRect(i, 70 - jawDrop/2 + (Math.random() * 8), 3, 22);
          ctx.fillRect(i, 70 + jawDrop/2 - 20 - (Math.random() * 8), 3, 22);
        }

        ctx.restore();

        // Analog static noise streaks
        for (let i = 0; i < 25; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.15)' : 'rgba(180,0,0,0.2)';
          ctx.fillRect(0, Math.random() * h, w, Math.random() * 6);
        }

        requestAnimationFrame(renderFrame);
      }

      renderFrame();
    }
  </script>
</body>
</html>
